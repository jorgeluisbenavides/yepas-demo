services:
  db:
    image: postgres:16-alpine
    container_name: yepas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: yepas_demo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yepas_demo"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: yepas-api
    restart: unless-stopped
    environment:
      APP_ENV: dev
      PORT: 8001
      APP_NAME: yepas-cms-loyalty-demo
      CACHE_KEY: test
      DATABASE: postgres://postgres:postgrespassword@db:5432/yepas_demo
      API_KEY: test
      EXPIRATION_TOKEN: 1h
      AUTHORIZATION_SECRET_EXPIRATION: 10m
      TIMEZONE: America/Mexico_City
    ports:
      - "8085:8001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yepas-web-demo
    restart: unless-stopped
    ports:
      - "8086:80"
    depends_on:
      - api

volumes:
  pgdata:
