# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Servicio de PostgreSQL necesario para knex migrate y pruebas
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: yepas_demo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api   # Todos los comandos corren dentro de api/

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter (ESLint)
        run: npx eslint .

      - name: Run tests & coverage
        env:
          APP_ENV: dev
          PORT: 8001
          APP_NAME: yepas-cms-loyalty-demo
          CACHE_KEY: test
          DATABASE: postgres://postgres:postgrespassword@localhost:5433/yepas_demo_test
          API_KEY: test
          EXPIRATION_TOKEN: 1h
          AUTHORIZATION_SECRET_EXPIRATION: 10m
          TIMEZONE: America/Mexico_City
        run: npm run test:coverage
